<div class="field">
  <label for="name" class="field-label">
  
    Name
  
  
</label>
  <div class="field-input-wrapper">
    <input name="name" id="name" type="text" aria-describedby="name-description">
    
    
  </div>
  
  <ul id="name-errors" class="field-errors" aria-live="polite">
  
</ul>
  <div id="name-description" class="field-description">
  
    The name on the tag.
  
</div>
</div>
<div class="field">
  <label for="bio" class="field-label">
  
    Bio
  
  
</label>
  <textarea name="bio" id="bio">
</textarea>
  <ul id="bio-errors" class="field-errors" aria-live="polite">
  
</ul>
  
</div>
<div class="field">
  <label for="breed" class="field-label">
  
    Breed
  
  
</label>
  <div class="field-select">
    <select name="breed" id="breed">
      
      <option value="golden">
  Golden Retriever
</option><option value="dachshund" selected>
  Dachshund
</option>
    </select>
  </div>
  <ul id="breed-errors" class="field-errors" aria-live="polite">
  
</ul>
  
</div>
<div class="field">
  <label class="field-label field-checkbox">
  
    <input type="hidden" name="sterilized" value="false">
    <input type="checkbox" name="sterilized" id="sterilized" value="true" checked>
    Sterilized
  
  
</label>
  <ul id="sterilized-errors" class="field-errors" aria-live="polite">
  
</ul>
  
</div>
<div class="field">
  <label class="field-label field-switch">
  
    <span class="field-switch-label" dir="auto">Vaccinated</span>
    <input type="hidden" name="vaccinated" value="false">
    <input type="checkbox" role="switch" name="vaccinated" id="vaccinated" value="true">
    <span class="field-switch-state">
      <span class="field-switch-state-on" aria-hidden="true">
        On
      </span>
      <span class="field-switch-state-off" aria-hidden="true">
        Off
      </span>
    </span>
  
  
</label>
  <ul id="vaccinated-errors" class="field-errors" aria-live="polite">
  
</ul>
  
</div>
<div class="field">
  <fieldset class="field-checkbox-group">
    <legend class="field-label">
      Tricks
      
    </legend>
    
    <div>
      <input type="hidden" name="tricks[]" value="">
      <label class="field-checkbox">
  <input type="checkbox" name="tricks[]" id="tricks_sit" value="sit">
  Sit
</label>
<label class="field-checkbox">
  <input type="checkbox" name="tricks[]" id="tricks_roll_over" value="roll-over">
  Roll over
</label>

    </div>
  </fieldset>
  <ul id="tricks-errors" class="field-errors" aria-live="polite">
  
</ul>
</div>
<div class="field">
  <fieldset class="field-radio-group">
    <legend class="field-label">
      Size
      
    </legend>
    
    <div>
      <label class="field-radio">
  <input type="radio" name="size" id="size_small" value="small">
  Small
</label>
<label class="field-radio">
  <input type="radio" name="size" id="size_large" value="large">
  Large
</label>

    </div>
  </fieldset>
  <ul id="size-errors" class="field-errors" aria-live="polite">
  
</ul>
</div>
